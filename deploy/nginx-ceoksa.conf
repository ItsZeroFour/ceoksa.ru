# Конфигурация nginx для ceoksa.ru
#
# Главная причина "подвисаний" сайта после долгого отсутствия —
# браузер отдаёт устаревший index.html из кэша, который ссылается
# на JS-файлы, удалённые при последнем деплое.
#
# Решение: index.html НЕ кэшировать (всегда брать свежий с сервера),
# а файлы из /static/ кэшировать надолго — их имена содержат хэш и
# меняются при каждой сборке, поэтому устаревания не будет.
#
# Применить: подставить путь к собранному client/build в root,
# скопировать server-блок в конфиг nginx и выполнить:
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name ceoksa.ru www.ceoksa.ru;

    root /var/www/ceoksa/client/build;
    index index.html;

    # Хэшированные ассеты — кэшируем на год, они иммутабельны.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html — никогда не кэшировать, всегда брать свежий.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # SPA-роутинг: любой путь отдаёт index.html.
    location / {
        try_files $uri /index.html;
    }

    # Проксирование API на Node-сервер (Express).
    location ~ ^/(auth|user|mobile|ocr|rim|validate|uploads|files|upload|logout|\.well-known)/ {
        proxy_pass http://155.212.184.8:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
